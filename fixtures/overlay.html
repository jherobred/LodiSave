<!doctype html>
<meta charset="utf-8">
<title>Transparent overlay</title>
<style>
  .wrap { position: relative; width: 400px; height: 300px; }
  .wrap img { width: 100%; height: 100%; pointer-events: none; }
  .cover { position: absolute; inset: 0; }
</style>
<p>The photo sits under an empty div and a stretched 1×1 spacer GIF, like Instagram and stock-photo sites.</p>
<div class="wrap" id="target">
  <img src="media/a.jpg?overlay">
  <div class="cover"></div>
  <img class="cover" src="media/spacer.gif">
</div>
<script>addEventListener('load', () => (window.__ready = true))</script>
