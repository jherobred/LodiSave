[package]
name = "lodisave-setup"
version = "0.1.0"
description = "The LodiSave installer and uninstaller."
authors = ["LodiSave contributors"]
license = "MIT"
repository = "https://github.com/jherobred/LodiSave"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = { version = "0.4.46", default-features = false }
tao = "0.37"
wry = "0.57"
zstd = { version = "0.13.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.11"
serde_json = "1.0.151"
tar = { version = "0.4.46", default-features = false }
zstd = { version = "0.13.3", default-features = false, features = ["zstdmt"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
